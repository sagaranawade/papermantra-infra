# api.papermantra.com → Papermantra Services (context path /papermantra)
server {
    listen 80;
    server_name api.papermantra.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.papermantra.com;

    ssl_certificate     /etc/letsencrypt/live/api.papermantra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.papermantra.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 50m;

    # Actuator runs on a separate internal port in prod (9092, no context path)
    location /papermantra/actuator/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://api:9092/actuator/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Long-running admin AI refine jobs (chapter / subject bulk)
    location /papermantra/api/v1/orchestration/ {
        proxy_pass http://api:9091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Live exam traffic from a school NAT must not share the 30 r/s API bucket.
    # (No limit_req here — omit the directive; "limit_req off" is invalid on nginx 1.27.)
    location ~ ^/papermantra/api/v1/mobile/live-tests/[^/]+/(start|heartbeat|submit)$ {
        proxy_pass http://api:9091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Live paper fetch after start (NEET ~180 IDs). QAG still enforces non-live caps.
    location = /papermantra/api/v1/mobile/questions/by-ids {
        limit_req zone=exam_limit burst=200 nodelay;
        proxy_pass http://api:9091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://api:9091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
