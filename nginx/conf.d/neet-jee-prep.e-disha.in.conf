# neet-jee-prep.e-disha.in → same React portal (full white-label, like StudyLab)
# DNS: partner CNAME/A to this VPS. Cloudflare: DNS only until Let's Encrypt is issued.

server {
    listen 80;
    server_name neet-jee-prep.e-disha.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://neet-jee-prep.e-disha.in$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name neet-jee-prep.e-disha.in;

    ssl_certificate     /etc/letsencrypt/live/neet-jee-prep.e-disha.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neet-jee-prep.e-disha.in/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    limit_req zone=general_limit burst=80 nodelay;

    location /papermantra/oauth2/ {
        proxy_pass http://api:9091;
        proxy_http_version 1.1;
        proxy_set_header Host api.papermantra.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /papermantra/login/oauth2/ {
        proxy_pass http://api:9091;
        proxy_http_version 1.1;
        proxy_set_header Host api.papermantra.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location / {
        set $upstream_portal portal:8080;
        proxy_pass http://$upstream_portal;
        proxy_http_version 1.1;
        # Crawlers (WhatsApp, Facebook) do not run JavaScript. Keep the HTML
        # uncompressed so the partner name replaces PaperMantra in the raw tags.
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter 'PaperMantra — AI Question Paper Generator, Online Exams &amp; JEE NEET CET Apps' 'EDULIGHT';
        sub_filter 'PaperMantra — AI Question Papers, Online Exams &amp; Prep Apps' 'EDULIGHT';
        sub_filter 'PaperMantra — AI Question Paper Generator by NeelMind' 'EDULIGHT';
        sub_filter 'Create AI question papers for JEE, NEET, MHT-CET, KCET, EAPCET / EAMCET and boards. Run online exams. Students practise on Android with AI Tutor — by NeelMind Technologies.' 'EDULIGHT — question papers, live tests, and student practice for institutes.';
        sub_filter 'PaperMantra by NeelMind Technologies: AI question paper generator for JEE, NEET, MHT-CET, KCET, EAPCET / EAMCET and boards, online exam software, Android preparation apps, and AI Tutor for coaching institutes and schools in India.' 'EDULIGHT — question papers, live tests, and student practice for institutes.';
        sub_filter 'https://www.papermantra.com/og-image.png' 'https://neet-jee-prep.e-disha.in/brands/edulight/icon-512.png';
        sub_filter 'https://www.papermantra.com/' 'https://neet-jee-prep.e-disha.in/';
        sub_filter 'https://www.neelmind.com' 'https://neet-jee-prep.e-disha.in';
        sub_filter 'NeelMind Technologies Pvt Ltd' 'EDULIGHT';
        sub_filter 'NeelMind Technologies' 'EDULIGHT';
        sub_filter 'NeelMind' 'EDULIGHT';
        sub_filter 'PaperMantra' 'EDULIGHT';
    }
}
